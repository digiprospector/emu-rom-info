# ==============================================================================
# 任天堂 FC / NES 数据库自定义调整规则配置 (Adjustments)
#
# 【说明】
# 本文件集中管理针对游戏数据的多种自定义调整规则。
# 程序运行（如 python fetch_fc_nes.py 或 python fetch_fc_nes.py --build）时，
# 会纯从 Raw 原始数据出发，自动读取并应用本文件中的所有调整规则。
# ==============================================================================

# ------------------------------------------------------------------------------
# 调整方式 1: 游戏中文名称调整 (title_zh)
# 作用：将指定游戏的中文译名 (title_zh) 修改为自定义名称。
# 语法支持：
#   原中文名: 新中文名      (例如 培基语音: 家用BASIC语言)
#   或 游戏ID: 新中文名     (例如 basic-family: 家用BASIC语言)
# ------------------------------------------------------------------------------
title_zh:
  "培基语音": "家用BASIC语言"
  "培基语音第三版": "家用BASIC语言V3"
  "电梯迷宫": "电梯大战"
  "前线任务": "前线"

# ------------------------------------------------------------------------------
# 调整方式 2: B站解说视频章节对齐调整 (video_mappings)
# 作用：当 B 站解说视频的分段名称与游戏库正式名称存在差异时，强制指定绑定关系。
# 语法支持：
#   目标游戏中文名（或游戏ID）: 视频分段章节名
# ------------------------------------------------------------------------------
video_mappings:
  "转转乐园": "咕噜咕噜世界/豆豆迷魂阵"
  "火凤凰/长生鸟": "火凤凰/凤凰战机"
  "推推乐": "顽皮精灵"
  "金牌奥运会": "超级奥林匹克"
  "机器人组合套件": "机器人方块套件"
  "机器人组件": "机器人陀螺套件"
  "疯狂赛车": "极速摩托车/美国摩托赛"
  "莎莎机器人": "漂浮枪手"
  "筋肉人摔角大赛": "筋肉人摔跤大赛"
  "吃豆人世界/小精灵世界": "吃豆人乐园"
  "汉堡世界": "汉堡时间"
  "决战富士山/空手道": "空手道"
  "高机动战斗II": "高机动战斗2"
  "Q太郎": "小鬼Q太郎 汪汪恐慌"
# ------------------------------------------------------------------------------
# 调整方式 3: 游戏属性通用修改 (games，高级微调，可选)
# 作用：支持按 ID 或中文名直接覆盖游戏字典中的任意字段（如 publishers、release_dates 等）。
# 示例：
# games:
#   - match:
#       id: basic-family
#     set:
#       title_zh: 家用BASIC语言
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# 调整方式 4: 跨版本/跨区游戏手动合并 (merge_games)
# 作用：当美版与日版游戏因标题完全不同导致未自动识别为同款游戏时，手动声明它们为同款游戏的跨区版本。
# 语法支持（键为目标主游戏，值为关联/合并版本，支持英文名、中文名或游戏 ID）：
#   "主游戏英文名/中文名/ID": "合并版本英文名/中文名/ID"
#
# 常见写法：
#   1. 以日版为主名： "Family Computer Robot Block Set": "Stack-Up"
#   2. 以美版为主名： "Stack-Up": "Family Computer Robot Block Set"
#   3. 使用中文名称： "机器人组合套件": "叠加方块"
#   4. 使用游戏 ID：   "family-computer-robot-block-set": "stack-up"
# ------------------------------------------------------------------------------
merge_games:
  "Family Computer Robot Block Set": "Stack-Up"

