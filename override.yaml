# ------------------------------------------------------------------------------
# 调整方式 5: 互斥游戏强制隔离/禁止合并 (separate_games)
# 作用：当不同游戏因中文译名相同、别名冲突或算法误判被合并时，显式声明它们不是同款游戏，禁止合并。
# 语法支持（支持游戏 ID、英文名、中文名或日文名）：
#   写法 1（键值对）：
#     "游戏A": "游戏B"
#   写法 2（列表组，支持 2 个或多个游戏两两互斥）：
#     - ["游戏A", "游戏B"]
# ------------------------------------------------------------------------------
separate_games:
  "abadox": "section-z"
  # 避免《Moonball Magic》(FDS 魔法弹珠台) 与任天堂官方《Pinball》(弹珠台) 因中文译名误合并
  "pinball": "moonball-magic"
  # 避免一代《Goal!》(NES 1989 / Moero!! Pro Soccer) 与二代《GOAL!!》(FC 1993 / Goal! Two) 跨区误合并
  "Goal!": "Goal!!"
  "moero-pro-soccer": "goal-two"

# ------------------------------------------------------------------------------
# 调整方式 6: 自定义 B站视频与显示文本 (bilibili_video)
# 作用：手动指定游戏的 Bilibili 视频链接 (url) 以及在网页前端显示的自定义文字 (text，可选)。
