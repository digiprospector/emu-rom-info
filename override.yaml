# ==============================================================================
# 任天堂 FC / NES 数据库自定义调整规则配置 (Adjustments)
#
# 【说明】
# 本文件集中管理针对游戏数据的多种自定义调整规则。
# 程序运行（如 python fetch_fc_nes.py 或 python fetch_fc_nes.py --build）时，
# 会纯从 Raw 原始数据出发，自动读取并应用本文件中的所有调整规则。
# ==============================================================================

# ------------------------------------------------------------------------------
# 调整方式 1: 游戏中文名称调整 (title_zh)
# 作用：将指定游戏的中文译名 (title_zh) 修改为自定义名称。
# 语法支持：
#   原中文名: 新中文名      (例如 培基语音: 家用BASIC语言)
#   或 游戏ID: 新中文名     (例如 basic-family: 家用BASIC语言)
# ------------------------------------------------------------------------------
