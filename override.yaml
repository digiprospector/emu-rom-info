# ==============================================================================
# 任天堂 FC / NES 数据库自定义调整规则配置 (Adjustments)
#
# 【说明】
# 本文件集中管理针对游戏数据的多种自定义调整规则。
# 程序运行（如 python fetch_fc_nes.py 或 python fetch_fc_nes.py --build）时，
# 会纯从 Raw 原始数据出发，自动读取并应用本文件中的所有调整规则。
# ==============================================================================

# ------------------------------------------------------------------------------
# 调整方式 1: 游戏中文名称调整 (title_zh)
# 作用：将指定游戏的中文译名 (title_zh) 修改为自定义名称。
# 语法支持：
#   原中文名: 新中文名      (例如 培基语音: 家用BASIC语言)
#   或 游戏ID: 新中文名     (例如 basic-family: 家用BASIC语言)
# ------------------------------------------------------------------------------
title_zh:
  "gomoku-narabe-renju": "五子棋"
  "basic-family": "家用BASIC语言"
  "exerion": "火凤凰/凤凰战机"
  "family-basic-v3": "家用BASIC语言V3"
  "flappy": "顽皮精灵"
  "track-field": "超级奥林匹克"
  "elevator-action": "电梯大战"
  "road-fighter": "公路战士/火箭车"
  "zippy-race": "极速摩托车/美国摩托赛"
  "family-computer-robot-block-set": "机器人方块套件"
  "front-line": "前线" #完成第1页
  "gyromite": "机器人陀螺套件"
  "kinniku-man-muscle-tag-match": "筋肉人摔跤大赛"
  "burgertime": "汉堡时间"
  "karateka": "空手道"
  "obake-no-q-tarou-wanwan-panic": "小鬼Q太郎 汪汪恐慌"
  "thexder": "变形战机"
  "son-son": "孙孙"
  "ninja-hattori-kun-ninja-wa-shuugyou-de-gozaru-no-maki": "忍者服部君-忍者修行之卷"
  "the-legend-of-zelda": "塞尔达传说" #完成第1页

# ------------------------------------------------------------------------------
# 调整方式 2: B站解说视频章节对齐调整 (video_mappings)
# 作用：当 B 站解说视频的分段名称与游戏库正式名称存在差异时，强制指定绑定关系。
# 语法支持：
#   目标游戏中文名（或游戏ID）: 视频分段章节名
# ------------------------------------------------------------------------------
video_mappings:
  "clu-clu-land": "咕噜咕噜世界/豆豆迷魂阵"
  "excite-bike": "越野摩托"
  "astro-robo-sasa": "漂浮枪手"
  "pac-land": "吃豆人乐园"
  "volguard-ii": "高机动战斗2"
  "dig-dug-ii": "打空气2/小叮当2"
  "sansuu-1-nen-keisan-game": "算数一年级~算数三年级"
  "sansuu-2-nen-keisan-game": "算数一年级~算数三年级"
  "sansuu-3-nen-keisan-game": "算数一年级~算数三年级"

# ------------------------------------------------------------------------------
# 调整方式 3: 游戏属性通用修改 (games，高级微调，可选)
# 作用：支持按 ID 或中文名直接覆盖游戏字典中的任意字段（如 publishers、release_dates 等）。
# 示例：
# games:
#   - match:
#       id: basic-family
#     set:
#       title_zh: 家用BASIC语言
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# 调整方式 4: 跨版本/跨区游戏手动合并 (merge_games)
# 作用：当美版与日版游戏因标题完全不同导致未自动识别为同款游戏时，手动声明它们为同款游戏的跨区版本。
# 语法支持（键为目标主游戏，值为关联/合并版本，支持英文名、中文名或游戏 ID）：
#   "主游戏英文名/中文名/ID": "合并版本英文名/中文名/ID"
#
# 常见写法：
#   1. 以日版为主名： "Family Computer Robot Block Set": "Stack-Up"
#   2. 以美版为主名： "Stack-Up": "Family Computer Robot Block Set"
#   3. 使用中文名称： "机器人组合套件": "叠加方块"
#   4. 使用游戏 ID：   "family-computer-robot-block-set": "stack-up"
# ------------------------------------------------------------------------------
merge_games:
  "family-computer-robot-block-set": "stack-up"
  "kinniku-man-muscle-tag-match": "m-u-s-c-l-e"
  "dragon-quest-2": "dragon-warrior-ii"
  "moero-pro-yakyuu": "bases-loaded"
  "family-trainer-no-1-athletic-world": "athletic-world"
  "puroresu-famicom-wrestling-association": "pro-wrestling"
  "burger-time": "burgertime"
  "lunar-pool": "lunar-ball"
  "obake-no-q-tarou-wanwan-panic": "chubby-cherub"

