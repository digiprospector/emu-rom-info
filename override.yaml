# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# 调整方式 4: 跨版本/跨区游戏手动合并 (merge_games)
# 作用：当美版与日版游戏因标题完全不同导致未自动识别为同款游戏时，手动声明它们为同款游戏的跨区版本。
# 语法支持（键为目标主游戏，值为关联/合并版本，支持英文名、中文名或游戏 ID）：
#   "主游戏英文名/中文名/ID": "合并版本英文名/中文名/ID"
#
# 常见写法：
#   1. 以日版为主名： "Family Computer Robot Block Set": "Stack-Up"
#   2. 以美版为主名： "Stack-Up": "Family Computer Robot Block Set"
#   3. 使用中文名称： "机器人组合套件": "叠加方块"
#   4. 使用游戏 ID：   "family-computer-robot-block-set": "stack-up"
# ------------------------------------------------------------------------------
merge_games:
  "family-computer-robot-block-set": "stack-up"
  "kinniku-man-muscle-tag-match": "m-u-s-c-l-e"
  "dragon-quest-2": "dragon-warrior-ii"
  "moero-pro-yakyuu": "bases-loaded"
  "family-trainer-no-1-athletic-world": "athletic-world"
  "puroresu-famicom-wrestling-association": "pro-wrestling"
  "burger-time": "burgertime"
  "lunar-pool": "lunar-ball"
  "obake-no-q-tarou-wanwan-panic": "chubby-cherub"
  "moero-twinbee-cinnamon-hakase-wo-sukue": "stinger"
  "tobidase-daisakusen": "3-d-worldrunner"
  "the-goonies-2-fratelli-saigo-no-chousen": "the-goonies-ii"
  "tanigawa-kouji-no-shougi-shinan-2": "tanigawa-kouji-no-shougi-shinan-ii-meijin-heno-michi"
  "ikari-warriors-ii-victory-road": "ikari-2-dogosoken"
  "great-tank": "iron-tank"
  "family-trainer-no-2-running-stadium": "stadium-events"
  "family-trainer-no-2-running-stadium": "world-class-track-meet"
  "golgo-13-dai-1-shou-kamigami-no-tasogare": "golgo-13-top-secret-episode"
  "meikyuu-kumikyoku": "milon-s-secret-castle"
  "the-legend-of-zelda-2-link-no-bouken": "zelda-ii-the-adventure-of-link"
  
# ------------------------------------------------------------------------------
# 调整方式 5: 互斥游戏强制隔离/禁止合并 (separate_games)
# 作用：当不同游戏因中文译名相同、别名冲突或算法误判被合并时，显式声明它们不是同款游戏，禁止合并。
# 语法支持（支持游戏 ID、英文名、中文名或日文名）：
#   写法 1（键值对）：
#     "游戏A": "游戏B"
#   写法 2（列表组，支持 2 个或多个游戏两两互斥）：
#     - ["游戏A", "游戏B"]
# ------------------------------------------------------------------------------
separate_games:
  "abadox": "section-z"

# ------------------------------------------------------------------------------
# 调整方式 6: 自定义 B站视频与显示文本 (bilibili_video)
# 作用：手动指定游戏的 Bilibili 视频链接 (url) 以及在网页前端显示的自定义文字 (text，可选)。
#       适用于未被编年史收录的游戏、需要指定特定独立解说/攻略/TAS/通关视频，或需要自定义按钮文本的情况。
# 语法支持（键名支持游戏 ID、中文名、英文名或日文名）：
#   写法 1（包含 url 与自定义文字）：
#     "游戏ID或名称":
#       url: "https://www.bilibili.com/video/BVxxxxxx/"
#       text: "视频解说"   # 可选，若省略则在 Web 上使用默认显示文字 ("视频介绍 BY 雷文" 等)
#   写法 2（仅指定 url，使用默认显示文字）：
#     "游戏ID或名称": "https://www.bilibili.com/video/BVxxxxxx/"
# ------------------------------------------------------------------------------
